<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="a review receipt bound to one commit">
  <rect width="720" height="250" rx="12" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
    <text x="28" y="40" fill="#8b949e">$ epoch-watch owner/repo#12</text>
    <text x="28" y="76" fill="#e6edf3">sha      9f2c1ab7e04d...  (head, 40 chars)</text>
    <text x="28" y="108" fill="#3fb950">✓</text><text x="52" y="108" fill="#e6edf3">open, not a draft</text>
    <text x="28" y="136" fill="#3fb950">✓</text><text x="52" y="136" fill="#e6edf3">github will merge it</text>
    <text x="28" y="164" fill="#3fb950">✓</text><text x="52" y="164" fill="#e6edf3">review receipt  approve-ready  @ same sha</text>
    <text x="28" y="192" fill="#3fb950">✓</text><text x="52" y="192" fill="#e6edf3">proof receipt   @ same sha</text>
    <text x="28" y="228" fill="#3fb950" font-weight="700">READY</text><text x="92" y="228" fill="#8b949e">push another commit and every ✓ goes void.</text>
  </g>
</svg>
